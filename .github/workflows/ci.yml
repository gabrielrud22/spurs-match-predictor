name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync
      - name: Smoke test - API starts and responds
        run: |
          uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/health 
#sleep 10 gives more buffer time, retry = retry after failure rather than quit after one attempt

      - name: Build Docker image
        run: docker build -t spurs-match-predictor .
